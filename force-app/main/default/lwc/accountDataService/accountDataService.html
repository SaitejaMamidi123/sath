<template>
    <lightning-card title="Account Manager" icon-name="standard:account">
        <div class="slds-p-horizontal_small">
            <template if:true={account.data}>
                <lightning-input
                label="Account Name"
                value={account.data.fields.Name.value}
                onchange={handlenameChange}>
                </lightning-input>
                <lightning-input
                label="Industry"
                value={account.data.fields.Industry.value}
                onchange={handleIndustryChange}>
                </lightning-input>

            <lightning-button variant="brand" label="Save Changes" onclick={saveAccount}></lightning-button>
            </template>
            <template if:true={account.error}>
                <p> Error Loading Account :{account.error.message}</p>
            </template>
        </div>
    </lightning-card>


</template>
