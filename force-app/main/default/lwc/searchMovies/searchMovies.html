<template>
    <lightning-card title="Customer Search System" icon-name="custom:custom99">
        <div class="slds-m-around_medium">
            <lightning-input
              label="Search Movies"
              value={searchKey}
              placeholder="Enter your Movie Name"
              onchange={handleSearchKeyChange}>
            </lightning-input>
            <lightning-button label="Search" onclick={handleSearch}></lightning-button>
        </div>

        
        <template if:true={movies.length}>
            <ul class="slds-m-around_medium">
                <template for:each={movies} for:item="movie">
                    <li key={movie.Id}>
                        <p>{movie__c.Name}</p>
                    </li>
                </template>
            </ul>
        </template>
        
        <template if:true={error}>
            <div class="slds-text-color_error">
                {error.message}
            </div>
        </template>
    </lightning-card>
</template>
