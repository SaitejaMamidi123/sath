<template>
    <lightning-card title="Update the Movie" icon-name="custom:custom99">
        <div class="custom-bg">
            <div class="top">
                <div class="col-1">
                    <template if:true={recordData}>
                        <label>{movielabel}</label>
                        <div class="a1">
                            <lightning-input type="text" value={Name} onchange={handleMovieName}></lightning-input>
                        </div>
                        <label>{realeaseDate}</label>
                        <div class="a2">
                            <lightning-input type="datetime" value={Release_Date} onchange={handleReleaseDate}></lightning-input>
                        </div>
                        <label>{directorEmail}</label>
                        <div class="a3">
                            <lightning-input type="email" value={Director_Email} onchange={handleEmail}></lightning-input>
                        </div>
                        <label>{releasedInTheatres}</label>
                        <div class="a4">
                            <lightning-input type="checkbox" checked={Released_In_Theatres} onchange={handleReleasedInTheatres}></lightning-input>
                        </div>
                        <label>{availableOnOTT}</label>
                        <div class="a5">
                            <lightning-input type="toggle" checked={isAvailable} onchange={handleToggle} message-toggle-active="" message-toggle-inactive=""></lightning-input>
                        </div>
                        <div class="a6">
                            <lightning-button variant="brand" label="Submit" onclick={handleSubmit}></lightning-button>
                        </div>
                    </template>
                </div>
                <div class="co1-2">
                    <!-- Prequel Search -->
                    <label>{prequel}</label>
                    <div class="s1" style="display: flex; align-items: center; gap: 8px; min-height: 44px;">
                        <template if:true={prequelName}>
                            <span class="search-result-item" style="display: flex; align-items: center; padding: 4px 12px; border-radius: 16px;">
                                <lightning-icon icon-name="custom:custom99" alternative-text="movie icon" size="small" class="slds-m-right_medium"></lightning-icon>
                                <span class="slds-pill__label">{prequelName}</span>
                                <button class="remove-prequel" onclick={handleRemovePrequel} title="Remove" style="background:none;border:none;cursor:pointer;margin-left:8px;">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <line x1="4" y1="4" x2="12" y2="12" stroke="#e68a3f" stroke-width="2"/>
                                        <line x1="12" y1="4" x2="4" y2="12" stroke="#e68a3f" stroke-width="2"/>
                                    </svg>
                                </button>
                            </span>
                        </template>
                        <template if:false={prequelName}>
                            <input type="text" class="plain-search" placeholder="Search for a prequel" value={searchTerm} oninput={handleSearch} style="border:none;outline:none;background:transparent;width:100%;font-size:17px;" />
                        </template>
                    </div>
                    <!-- Search Results -->
                    <template if:true={hasPrequelSearchResults}>
                        <ul class="search-results slds-dropdown slds-dropdown_fluid slds-p-around_medium">
                            <template for:each={searchResults} for:item="result">
                                <li key={result.value} class="search-result-item" onclick={handlePrequelSelect} data-id={result.value} data-name={result.label}>
                                    <lightning-icon icon-name="custom:custom99" alternative-text="movie icon" size="medium" class="slds-m-right_medium"></lightning-icon>
                                    <span class="slds-pill__label">{result.label}</span>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <!-- Producer Search -->
                    <label>{producerLabel}</label>
                    <div class="s1" style="display: flex; align-items: center; gap: 8px; min-height: 44px;">
                        <template if:true={producerName}>
                            <span class="search-result-item" style="display: flex; align-items: center; padding: 4px 12px; border-radius: 16px;">
                                <lightning-icon icon-name="custom:custom99" alternative-text="producer icon" size="small" class="slds-m-right_medium"></lightning-icon>
                                <span class="slds-pill__label">{producerName}</span>
                                <button class="remove-prequel" onclick={handleRemoveProducer} title="Remove" style="background:none;border:none;cursor:pointer;margin-left:8px;">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <line x1="4" y1="4" x2="12" y2="12" stroke="#e68a3f" stroke-width="2"/>
                                        <line x1="12" y1="4" x2="4" y2="12" stroke="#e68a3f" stroke-width="2"/>
                                    </svg>
                                </button>
                            </span>
                        </template>
                        <template if:false={producerName}>
                            <input type="text" class="plain-search" placeholder="Search for a producer" value={producerSearchTerm} oninput={handleProducerSearch} style="border:none;outline:none;background:transparent;width:100%;font-size:17px;" />
                        </template>
                    </div>
                    <!-- Producer Search Results -->
                    <template if:true={hasProducerSearchResults}>
                        <ul class="search-results slds-dropdown slds-dropdown_fluid slds-p-around_medium">
                            <template for:each={producerSearchResults} for:item="result">
                                <li key={result.value} class="search-result-item" onclick={handleProducerSelect} data-id={result.value} data-name={result.label}>
                                    <lightning-icon icon-name="custom:custom99" alternative-text="producer icon" size="medium" class="slds-m-right_medium"></lightning-icon>
                                    <span class="slds-pill__label">{result.label}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
            </div>
            <template if:false={recordData}>
                <p>Loading....</p>
            </template>
        </div>
    </lightning-card>
</template>
